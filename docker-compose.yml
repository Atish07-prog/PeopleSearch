services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: people_search
      POSTGRES_USER: people_search
      POSTGRES_PASSWORD: people_search
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U people_search -d people_search"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
