<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>People Search</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f7f4ee;
        color: #202124;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(135deg, rgba(32, 33, 36, 0.04), transparent 35%),
          #f7f4ee;
      }

      main {
        width: min(960px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      header {
        display: grid;
        gap: 10px;
        margin-bottom: 28px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 4rem);
        line-height: 0.95;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #5f6368;
      }

      form {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        margin-bottom: 24px;
      }

      input {
        width: 100%;
        min-height: 48px;
        border: 1px solid #d7d2c8;
        border-radius: 8px;
        padding: 0 14px;
        font: inherit;
        background: #fffdfa;
      }

      input:focus {
        border-color: #256f8f;
        outline: 3px solid rgba(37, 111, 143, 0.18);
      }

      button {
        min-height: 48px;
        border: 0;
        border-radius: 8px;
        padding: 0 18px;
        font: inherit;
        font-weight: 700;
        color: white;
        background: #256f8f;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .summary {
        min-height: 24px;
        margin-bottom: 12px;
        font-weight: 700;
        color: #34383c;
      }

      .results {
        display: grid;
        gap: 12px;
      }

      .person {
        border: 1px solid #ded8ce;
        border-radius: 8px;
        padding: 16px;
        background: #fffdfa;
      }

      .person h2 {
        margin: 0 0 6px;
        font-size: 1.1rem;
        letter-spacing: 0;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 10px;
        color: #5f6368;
      }

      .skills {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .skill {
        border-radius: 999px;
        padding: 4px 8px;
        font-size: 0.85rem;
        background: #e8f0f3;
        color: #214f63;
      }

      .empty,
      .error {
        border: 1px solid #ded8ce;
        border-radius: 8px;
        padding: 18px;
        background: #fffdfa;
        color: #5f6368;
      }

      .error {
        border-color: #e2a6a6;
        color: #8a1f1f;
      }

      @media (max-width: 640px) {
        form {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>People Search</h1>
        <p>Search the local mock people dataset by name, role, company, location, or skill.</p>
      </header>

      <form id="search-form">
        <input
          id="query"
          name="query"
          type="search"
          autocomplete="off"
          placeholder="Try Maya, engineer, python, Northstar..."
        />
        <button id="submit" type="submit">Search</button>
      </form>

      <div id="summary" class="summary"></div>
      <section id="results" class="results" aria-live="polite"></section>
    </main>

    <script>
      const form = document.querySelector("#search-form");
      const input = document.querySelector("#query");
      const submit = document.querySelector("#submit");
      const summary = document.querySelector("#summary");
      const results = document.querySelector("#results");

      function renderPeople(payload) {
        summary.textContent = `${payload.total} result${payload.total === 1 ? "" : "s"}`;

        if (payload.results.length === 0) {
          results.innerHTML = '<div class="empty">No people matched that search.</div>';
          return;
        }

        results.innerHTML = payload.results
          .map((person) => {
            const role = [person.title, person.company].filter(Boolean).join(" at ");
            const location = person.location ? `<span>${person.location}</span>` : "";
            const email = person.email ? `<span>${person.email}</span>` : "";
            const skills = person.skills
              .map((skill) => `<span class="skill">${skill}</span>`)
              .join("");

            return `
              <article class="person">
                <h2>${person.full_name}</h2>
                <div class="meta">
                  ${role ? `<span>${role}</span>` : ""}
                  ${location}
                  ${email}
                </div>
                <div class="skills">${skills}</div>
              </article>
            `;
          })
          .join("");
      }

      async function search(query = "") {
        submit.disabled = true;
        summary.textContent = "Searching...";
        results.innerHTML = "";

        try {
          const response = await fetch("/search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query, limit: 10, offset: 0 }),
          });

          if (!response.ok) {
            throw new Error(`Search failed with HTTP ${response.status}`);
          }

          renderPeople(await response.json());
        } catch (error) {
          summary.textContent = "";
          results.innerHTML = `<div class="error">${error.message}</div>`;
        } finally {
          submit.disabled = false;
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        search(input.value.trim());
      });

      search();
    </script>
  </body>
</html>
